<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <style>
        /* Background belakang (bisa warna atau gambar) */
        .container-bg {
            background: linear-gradient(90deg, #0051ff 50%, #ff0000 50%);
            padding: 50px;
            display: flex;
            justify-content: center;
        }

        /* Kotak Utama */
        .box-invert {
            position: relative;
            padding: 20px 40px;
            font-family: sans-serif;
            font-weight: bold;
            color: white;
            /* Teks juga bisa ikut ter-invert jika pakai blend mode */
        }

        /* Membuat Border Invert dengan Pseudo-element */
        .box-invert::before {
            content: "";
            position: absolute;
            inset: 0;
            /* Mengisi seluruh area box */

            /* Buat border putih */
            border: 4px solid #d10000;

            /* Efek pembalik warna dari elemen belakangnya */
            mix-blend-mode:multiply;

            pointer-events: none;
            /* Agar tidak menghalangi klik ke dalam box */
        }
    </style>
</head>

<body>
    <div class="container-bg">
        <div class="box-invert">
            Teks di dalam kotak
        </div>
    </div>
</body>

</html>
